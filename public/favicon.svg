<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" fill="url(#grad)" rx="28"/>
  
  <!-- Document/Ticket shape -->
  <rect x="28" y="32" width="72" height="64" fill="white" rx="4" stroke="none"/>
  
  <!-- Checkmark for completed/resolved -->
  <g transform="translate(40, 45)">
    <path d="M 2 14 L 10 22 L 30 2" stroke="#10b981" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Bottom info lines (subtle) -->
  <line x1="40" y1="78" x2="80" y2="78" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="86" x2="88" y2="86" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
</svg>